<div class="space-y-1">
    {% for l in lists %}
    <a hx-get="/lists/{{ l.uuid }}" hx-target="#main" hx-push-url="true" class="flex flex-row space-x-4 px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded items-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 bg-gray-500 text-gray-500 rounded-full">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ l.title }}</span>
    </a>
    {% endfor %}
</div>
