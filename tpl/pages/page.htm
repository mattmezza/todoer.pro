<!doctype html>
<html>
<head>
    <title>td</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{ url_for('public', path='/style.css') }}" rel="stylesheet">
</head>
<body class="dark:bg-slate-950 dark:text-zinc-100 min-h-screen">
    <nav class="h-12 dark:bg-slate-900 w-full px-8 flex flex-row justify-between items-center sticky top-0">
        <div class="flex flex-row items-center justify-start space-x-1">
            <button class="px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded" onclick="toggleSidePanel()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </button>
            <a hx-get="/" hx-target="#main" hx-push-url="true" class="px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
            </a>
            <form class="px-2 py-1 flex flex-row justify-start items-center space-x-1 rounded bg-gray-50/5 hover:bg-gray-50/10 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg>
                <input type="text" class="bg-transparent outline-none" name="q" placeholder="Search">
            </form>
        </div>
        <div class="flex flex-row items-center justify-end space-x-1">
            <button class="px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
            </button>
            <button class="px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded">
               <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </nav>
    <div class="flex flex-row">
        <nav id="sidePanel" class="w-64 dark:bg-slate-900/50 py-10 pl-8 pr-2 min-h-screen h-full font-light space-y-12">
            <div class="space-y-1">
                <a href="/inbox" class="flex flex-row space-x-4 px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 text-blue-500">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 13.5h3.86a2.25 2.25 0 012.012 1.244l.256.512a2.25 2.25 0 002.013 1.244h3.218a2.25 2.25 0 002.013-1.244l.256-.512a2.25 2.25 0 012.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 00-2.15-1.588H6.911a2.25 2.25 0 00-2.15 1.588L2.35 13.177a2.25 2.25 0 00-.1.661z" />
                    </svg>
                    <span>Inbox</span>
                </a>
                <a href="/today" class="flex flex-row space-x-4 px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 text-green-500">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                    </svg>
                    <span>Today</span>
                </a>
                <a href="/upcoming" class="flex flex-row space-x-4 px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 text-purple-500">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0 2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0 2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0 2.25h.008v.008H7.5v-.008zm6.75-4.5h.008v.008h-.008v-.008zm0 2.25h.008v.008h-.008V15zm0 2.25h.008v.008h-.008v-.008zm2.25-4.5h.008v.008H16.5v-.008zm0 2.25h.008v.008H16.5V15z" />
                    </svg>
                    <span>Upcoming</span>
                </a>
            </div>
            <div class="space-y-2 group">
                <div class="flex flex-row justify-between items-center">
                    <h3 class="font-bold text-sm px-2">Lists</h3>
                    <a hx-get="/lists/new" hx-target="#main" hx-push-url="true" class="flex flex-row space-x-1 px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded items-center text-zinc-400 hover:text-zinc-50 invisible group-hover:visible">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                    </a>
                </div>
                <div class="pt-4 w-full" hx-get="/nav/lists" hx-target="this" hx-swap="outerHTML" hx-trigger="load">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 animate-spin mx-auto opacity-50">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                </div>
            </div>
        </nav>
        <div id="main" class="p-10 flex-grow overflow-y-auto">
            {% block content %}{% endblock %}
        </div>
    </div>
    <!-- Hot reload script -->
    <script src="https://unpkg.com/htmx.org@1.9.5"></script>
    {% if DEBUG %} {{ hot_reload.script(url_for('hot-reload')) | safe }} {% endif%}
    <script>
        function toggleSidePanel() {
            const sidePanel = document.getElementById("sidePanel")
            if (sidePanel.style.display === 'none') {
                sidePanel.style.display = 'block'
            } else {
                sidePanel.style.display = 'none'
            }
        }
    </script>
</body>
</html>
