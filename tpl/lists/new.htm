{% if not request.headers["hx-request"] %}{% extends "pages/page.htm" %}{% endif %}
{% block content %}
<div class="space-y-2">
    <h1 class="text-2xl font-bold pb-4">New List</h1>
    <form class="flex flex-row space-x-1" hx-target="next ul" hx-swap="afterbegin" hx-post="/lists/{{ uuid }}/todo" hx-on::after-request="this.reset()">
        <input autofocus class="flex-grow rounded bg-transparent placeholder:italic outline-none text-zinc-200 ml-4" name="content" placeholder="Add a todo..." />
    </form>
</div>
{% endblock %}
