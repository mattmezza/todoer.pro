<div class="title-wrapper mt-2">
    <div class="font-bold text-2xl flex gap-2 items-center">
        <div class="flex flex-row gap-2 items-center">
            <input
                hx-put="/tasks/{{ task.sid }}/complete"
                hx-target="closest .title-wrapper"
                hx-swap="outerHTML"
                type="checkbox"
                name="complete"
                class="rounded-full w-6 h-6 cursor-pointer"
                style="accent-color: {{ list.color }}"
                {% if task.complete %}checked{% endif %}>
            <h2
                class="cursor-pointer hover:text-white rounded px-2 py-1 {% if task.complete %}line-through{% endif %}"
                _="on click hide me then show the next <form /> then select() the next <input />">
                {{ task.title }}
            </h2>
        </div>
        <form
            class="flex items-center gap-1 w-full"
            hx-put="/tasks/{{ task.sid }}/title"
            hx-target="closest .title-wrapper"
            hx-swap="outerHTML"
            style="display: none"
            _="on submit or reset hide me then show the previous <h2 />">
            <input
                class="form-input px-2 py-1 text-2xl text-white w-full grow"
                name="title"
                value="{{ task.title }}"
                _="on keyup[key is 'Escape'] reset() on the closest <form />">
            <div class="flex items-center">
                <button type="reset" class="btn text-xs py-0.5 text-white">Cancel</button>
                <button type="submit" class="btn bg-indigo-500 text-xs py-0.5 text-white">Save</button>
            </div>
        </form>
    </div>
    {% if task.complete %}
    <p class="text-xs italic dark:text-slate-600" title="Completed on {{ task.completed }}">Completed {{ task.completed|age }}</p>
    {% endif %}
</div>
