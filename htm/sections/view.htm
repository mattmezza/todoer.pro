{% if not request.headers["hx-request"] %}{% extends "pages/page.htm" %}{% endif %}
{% block content %}
<li>
    <div class="flex items-center justify-between border-b border-slate-200/20 text-sm">
        <div class="flex items-center gap-1">
            <button _="on click hide the next <ul /> then hide the next .add-task-btn then hide me then show the next <button />">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3 h-3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
            <button style="display: none" _="on click show the next <ul /> then show the next .add-task-btn then hide me then show the previous <button />">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3 h-3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                </svg>
            </button>
            <h2 class="font-semibold">{{ section.title }}</h2>
        </div>
        <div class="">
            <button class="hover:text-red-500">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3 h-3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                </svg>
            </button>
        </div>
    </div>
    <!--<h4 class="text-xs">{{ section.descr }}</h3>-->
    <ul class="list-none space-y-1">
        {% for task in html.tasks %}
        {{ task|safe }}
        {% endfor %}
    </ul>
    <div class="add-task-btn flex flex-row space-x-1 items-center rounded px-3 py-3 group cursor-pointer" _="on click hide me then show the next <form /> then focus() the next <input />">
        <button tabindex="0" class="btn group-hover:text-indigo-500 gap-2">
            <span class="group-hover:bg-indigo-500 group-hover:text-white rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" />
                </svg>
            </span>
            <span>Add todo</span>
        </button>
    </div>
    <form style="display: none" class="rounded-sm border border-slate-600" hx-target="previous ul" hx-swap="beforeend" hx-post="/tasks" hx-on::after-request="this.reset()" _="on reset or keyup[key is 'Escape'] hide me then show the previous <div />">
        <div class="py-2"">
            <input class="form-input block py-1 px-23 border-0 w-full" name="title" placeholder="Task name" autofocus>
            <input type="hidden" name="section" value="{{ section.uuid }}">
            <textarea
                autofocus
                name="descr"
                placeholder="Description"
                x-data="{ 
                    resize () { 
                        $el.style.height = '0px'; 
                        $el.style.height = $el.scrollHeight + 'px' 
                    } 
                }"
                x-init="resize()"
                @input="resize()"
                _="on keyup[key is 'Escape'] reset() the closest <form />" 
                class="form-input h-auto min-h-[40px] block py-1 px-23 border-0 w-full resize-none"
                ></textarea>

        </div>
        <div class="flex flex-row justify-between items-center border-t border-slate-600 px-3 py-2">
            <div>
            </div>
            <div class="space-x-2">
                <button type="reset" class="btn py-1">Cancel</button>
                <button type="submit" class="btn py-1 bg-indigo-600 text-white">Add task</button>
            </div>
        </div>
    </form>
</li>
{% endblock %}
