<div x-data="{ open: false }" class="lg:hidden absolute bottom-0 w-full dark:bg-gray-950/80 backdrop-blur-sm py-4 flex flex-col gap-8 items-center justify-start rounded-t" @click.outside="open = false">
    <button @click="open = true" x-show="!open" class="hover:text-indigo-500 w-full cursor-pointer uppercase font-bold">Lists</button>
    <button @click="open = false" x-show="open" class="hover:text-indigo-500 w-full cursor-pointer uppercase font-bold">Close</button>
    <ul x-show="open" class="max-h-96" hx-get="/nav/lists" hx-trigger="load, list-delete from:body, list-create from:body, list-update from:body, task-update from:body, task-delete from:body, task-create from:body">
    </ul>
    <div x-show="open" class="uppercase font-bold flex flex-row gap-4 justify-center items-center">
        <a class="hover:text-indigo-500 cursor-pointer" hx-get="/users/me" hx-push-url="true" hx-target="#main" @click="open = false">Profile</a>
        <a class="hover:text-indigo-500" href="/signout">Logout</a>
    </div>
</div>
