<div class="min-w-fit">
    <!-- Sidebar backdrop (mobile only) -->
    <div class="fixed inset-0 bg-slate-900 bg-opacity-30 z-40 lg:hidden lg:z-auto transition-opacity duration-200 opacity-100" aria-hidden="true"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="flex flex-col absolute z-40 left-0 top-0 lg:static lg:left-auto lg:top-auto lg:translate-x-0 h-[100dvh] overflow-y-scroll lg:overflow-y-auto no-scrollbar w-64 lg:w-20 lg:sidebar-expanded:!w-64 2xl:!w-64 shrink-0 bg-slate-800 p-4 transition-all duration-200 ease-in-out translate-x-0">

        <!-- Sidebar header -->
        <div class="flex justify-between mb-10 pr-3 sm:px-2">
            <!-- Logo -->
            <a class="flex flex-row items-center gap-2 font-extrabold text-xl hover:text-white duration-150" href="/">
                <svg width="32" height="32" viewBox="0 0 32 32">
                    <defs>
                        <linearGradient x1="28.538%" y1="20.229%" x2="100%" y2="108.156%" id="logo-a">
                            <stop stop-color="#A5B4FC" stop-opacity="0" offset="0%"></stop>
                            <stop stop-color="#A5B4FC" offset="100%"></stop>
                        </linearGradient>
                        <linearGradient x1="88.638%" y1="29.267%" x2="22.42%" y2="100%" id="logo-b">
                            <stop stop-color="#38BDF8" stop-opacity="0" offset="0%"></stop>
                            <stop stop-color="#38BDF8" offset="100%"></stop>
                        </linearGradient>
                    </defs>
                    <rect fill="#6366F1" width="32" height="32" rx="16"></rect>
                    <path d="M18.277.16C26.035 1.267 32 7.938 32 16c0 8.837-7.163 16-16 16a15.937 15.937 0 01-10.426-3.863L18.277.161z" fill="#4F46E5"></path>
                    <path d="M7.404 2.503l18.339 26.19A15.93 15.93 0 0116 32C7.163 32 0 24.837 0 16 0 10.327 2.952 5.344 7.404 2.503z" fill="url(#logo-a)"></path>
                    <path d="M2.223 24.14L29.777 7.86A15.926 15.926 0 0132 16c0 8.837-7.163 16-16 16-5.864 0-10.991-3.154-13.777-7.86z" fill="url(#logo-b)"></path>
                </svg>
                <!--<span class="">Todoer</span>-->
            </a>
        </div>

        <!-- Links -->
        <div class="space-y-8">
            <!-- Pages group -->
            <div>
                <h3 class="text-xs uppercase text-slate-500 font-semibold pl-3">
                    <span class="hidden lg:block lg:sidebar-expanded:hidden 2xl:hidden text-center w-6" aria-hidden="true">•••</span>
                    <span class="lg:hidden lg:sidebar-expanded:block 2xl:block">Pages</span>
                </h3>
                <ul class="mt-3">
                    <!-- Dashboard -->
                    <li class="px-3 py-2 rounded-sm mb-0.5 last:mb-0">
                        <a class="block text-slate-200 hover:text-slate-200 truncate transition duration-150 cursor-pointer" hx-get="/" hx-target="#main" hx-push-url="true">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center">
                                    <svg class="shrink-0 h-6 w-6" viewBox="0 0 24 24">
                                        <path class="fill-current text-slate-400" d="M12 0C5.383 0 0 5.383 0 12s5.383 12 12 12 12-5.383 12-12S18.617 0 12 0z"></path>
                                        <path class="fill-current text-slate-600" d="M12 3c-4.963 0-9 4.037-9 9s4.037 9 9 9 9-4.037 9-9-4.037-9-9-9z"></path>
                                        <path class="fill-current text-slate-400" d="M12 15c-1.654 0-3-1.346-3-3 0-.462.113-.894.3-1.285L6 6l4.714 3.301A2.973 2.973 0 0112 9c1.654 0 3 1.346 3 3s-1.346 3-3 3z"></path>
                                    </svg>
                                    <span class="text-sm font-medium ml-3 lg:opacity-0 lg:sidebar-expanded:opacity-100 2xl:opacity-100 duration-200">Dashboard</span>
                                </div>
                            </div>
                        </a>
                    </li>
                    <!-- Tasks -->
                    <li class="px-3 py-2 rounded-sm mb-0.5 last:mb-0 bg-slate-900" x-data="{ open: true }">
                        <a class="block text-slate-200 truncate transition duration-150" href="#0">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center">
                                    <svg class="shrink-0 h-6 w-6" viewBox="0 0 24 24">
                                        <path class="fill-current text-indigo-500" d="M8 1v2H3v19h18V3h-5V1h7v23H1V1z"></path>
                                        <path class="fill-current text-indigo-500" d="M1 1h22v23H1z"></path>
                                        <path class="fill-current text-indigo-300" d="M15 10.586L16.414 12 11 17.414 7.586 14 9 12.586l2 2zM5 0h14v4H5z"></path>
                                    </svg>
                                    <span class="text-sm font-medium ml-3 lg:opacity-0 lg:sidebar-expanded:opacity-100 2xl:opacity-100 duration-200">Tasks</span>
                                </div>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>
            <!-- More group -->
            <div>
                <h3 class="text-xs uppercase text-slate-500 font-semibold pl-3">
                    <span class="hidden lg:block lg:sidebar-expanded:hidden 2xl:hidden text-center w-6" aria-hidden="true">•••</span>
                    <span class="lg:hidden lg:sidebar-expanded:block 2xl:block">Lists</span>
                </h3>
                <ul id="nav-lists" class="mt-3" hx-get="/nav/lists" hx-trigger="load, list-delete from:body, list-create from:body, list-update from:body, task-update from:body, task-delete from:body, task-create from:body">
                </ul>
                <div class="px-3 py-2 rounded-sm mb-0.5 last:mb-0 text-sm">
                    <a _="on click showModal() on the next <dialog />" class="block text-slate-200 hover:text-white transition duration-150 cursor-pointer" data-loading-target="#loading-main" data-loading-remove-class="hidden" :class="open &amp;&amp; 'hover:text-slate-200'">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                                </svg>
                                <span class="text-sm font-medium ml-3 lg:opacity-0 lg:sidebar-expanded:opacity-100 2xl:opacity-100 duration-200">Add list</span>
                            </div>
                        </div>
                    </a>
                </div>
                <dialog class="backdrop:white/95 dark:backdrop:black dark:text-zinc-50 w-full sm:w-11/12 md:w-1/2 lg:w-1/3 bg-white dark:bg-slate-800 shadow-lg rounded border border-slate-200 dark:border-slate-700 h-1/2">
                    <form class="flex flex-col h-full p-8" _="on submit reset() on me then close() the closest <dialog /> on reset close() the closest <dialog />" hx-post="/lists" hx-target="#nav-lists" hx-swap="beforeend">
                        <header>
                            <div class="flex items-center justify-start gap-2">
                                <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 bg-rose-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-9 h-9 fill-current text-rose-50">
                                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" />
                                    </svg>
                                </div>
                            <h2 class="text-xl leading-snug font-bold">Add a new list</h2>
                                <div class="flex shrink-0 -space-x-3 -ml-px">
                                </div>
                            </div>
                        </header>
                        <div class="grow pt-4">
                            <div class="text-sm">You can choose a color to mark your list and set a description for the kind of tasks it will hold.</div>
                            <div class="flex flex-col gap-3 mt-4">
                                <div class="space-y-1">
                                    <div class="text-xs flex flex-row items-center">
                                        <span>Color</span>
                                    </div>
                                    <input tabindex="1" type="color" class="bg-transparent border-0 rounded outline-none" name="color" value="#ff0000" />
                                    <div class="text-xs flex flex-row items-center justify-end">
                                    </div>
                                </div>
                                <div class="space-y-1">
                                    <div class="text-xs flex flex-row items-center">
                                        <span>List name</span>
                                    </div>
                                    <input tabindex="0" autofocus class="form-input w-full" name="title" placeholder="Type here..." />
                                    <div class="text-xs flex flex-row items-center justify-end">
                                    </div>
                                </div>
                                <div class="space-y-1">
                                    <div class="text-xs flex flex-row items-center">
                                        <span>Description</span>
                                    </div>
                                    <textarea class="form-input w-full resize-none" name="descr" placeholder="Type here..."></textarea>
                                    <div class="text-xs flex flex-row items-center justify-end">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <footer class="pt-2">
                            <div class="flex justify-between items-center">
                                <div>
                                </div>
                                <div class="flex flex-row gap-2 items-center justify-end">
                                    <button type="reset" class="btn rounded px-8 py-1">
                                        Cancel
                                    </button>
                                    <button type="submit" class="btn bg-indigo-600 text-white rounded px-8 py-1">
                                        Save
                                    </button>
                                </div>
                            </div>
                        </footer>
                    </form>
                </dialog>
            </div>
        </div>

        <!-- Expand / collapse button
        <div class="pt-3 hidden lg:inline-flex 2xl:hidden justify-end mt-auto">
            <div class="px-3 py-2">
                <button @click="sidebarExpanded = !sidebarExpanded">
                    <span class="sr-only">Expand / collapse sidebar</span>
                    <svg class="w-6 h-6 fill-current sidebar-expanded:rotate-180" viewBox="0 0 24 24">
                        <path class="text-slate-400" d="M19.586 11l-5-5L16 4.586 23.414 12 16 19.414 14.586 18l5-5H7v-2z"></path>
                        <path class="text-slate-600" d="M3 23H1V1h2z"></path>
                    </svg>
                </button>
            </div>
        </div>
        -->
    </div>
</div>
