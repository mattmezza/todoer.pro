{% if not request.headers["hx-request"] %}{% extends "pages/page.htm" %}{% endif %}
{% block content %}
<div class="space-y-2 p-8">
    <div class="flex flex-row gap-3 items-center p-4">
        <span class="rounded-full w-6 h-6" style="background-color: {{ color }}">&nbsp;</span>
        <h1 class="text-2xl font-bold">{{ title }}</h1>
        <div class="group">
            <button class="p-1 group-hover:bg-slate-50/10">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM18.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                </svg>
            </button>
            <div class="w-36 bg-slate-950 rounded z-10 text-xs absolute hidden group-hover:block space-y-2">
                <div class="space-y-1">
                    <button class="flex flex-row gap-2 items-center hover:bg-slate-50/10 px-3 py-2 w-full transition-all active:scale-95 rounded-t">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
                        </svg>
                        <span>Rename</span>
                    </button>
                    <button hx-delete="/lists/{{ uuid }}" hx-confirm="Are you sure?" hx-target="#main" hx-replace-url="/" id="list-delete" class="flex flex-row gap-2 items-center hover:bg-slate-50/10 px-3 py-2 w-full transition-all active:scale-95 rounded-b">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 text-red-500">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                        </svg>
                        <span>Remove</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <ul class="list-none space-y-1">
        {% for todo in html.todos %}
        {{ todo|safe }}
        {% endfor %}
    </ul>
    <form class="flex flex-row space-x-1 items-center focus-within:bg-slate-50/10 rounded px-3 py-3" hx-target="previous ul" hx-swap="beforeend" hx-post="/lists/{{ uuid }}/todo" hx-on::after-request="this.reset()">
        <label class="content">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" />
            </svg>
        </label>
        <input class="form-input ml-4" name="title" placeholder="Add a todo" />
    </form>
</div>
{% endblock %}
