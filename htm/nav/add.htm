<li class="px-3 py-2 rounded-sm mb-0.5 last:mb-0">
    <a class="block text-slate-200 hover:text-white transition duration-150 cursor-pointer" data-loading-target="#loading-main" data-loading-remove-class="hidden" :class="open &amp;&amp; 'hover:text-slate-200'" hx-get="/lists/{{ list.sid }}" hx-target="#main" hx-push-url="true">
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <span class="rounded-full shrink-0 w-6 h-6" style="background-color: {{ list.color }}">&nbsp;</span>
                <span class="text-sm font-medium ml-3 lg:opacity-0 lg:sidebar-expanded:opacity-100 2xl:opacity-100 duration-200">{{ list.title }}</span>
            </div>
            <div class="flex flex-shrink-0 ml-2">
                <span class="inline-flex items-center justify-center h-5 text-xs font-medium text-white bg-indigo-500 px-2 rounded">
                    {{ list.incomplete }}
                </span>
            </div>
        </div>
    </a>
</li>
