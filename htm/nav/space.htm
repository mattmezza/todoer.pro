{% macro nav_space(space) %}
<li class="px-3 py-2 rounded-sm mb-0.5 last:mb-0">
    <a
        href="/space/{{ space.sid }}"
        class="block text-slate-200 hover:text-white transition duration-150 cursor-pointer"
        :class="open &amp;&amp; 'hover:text-slate-200'"
        @click="open = false">
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <span
                    class="text-sm font-medium lg:opacity-0 lg:sidebar-expanded:opacity-100 2xl:opacity-100 duration-200 text-ellipsis overflow-hidden">
                    {{ space.title[0:20] }}
                </span>
            </div>
            <div class="flex flex-shrink-0 ml-2">
            </div>
        </div>
    </a>
</li>
{% endmacro %}
