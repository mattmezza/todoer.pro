<li class="" hx-target="this" hx-swap="outerHTML">
    <form class="flex flex-row space-x-2 items-center" hx-put="/todos/{{ uuid }}">
        <input type="text" class="hover:bg-slate-50/20 bg-slate-50/10 rounded cursor-pointer py-2 px-4 w-full placeholder:italic outline-none" name="title" placeholder="Todo..." value="{{ title }}" autofocus >
        <input type="hidden" name="done" {% if done %}value="on"{% endif %} />
    </form>
</li>
