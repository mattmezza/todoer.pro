{% if not request.headers["hx-request"] %}{% extends "lists/view.htm" %}{% endif %}
{% block detail %}
<div class="px-2">
    <form class="mb-8">
        <h2 class="font-bold text-lg mb-4 {% if done %}line-through{% endif %}">{{ content }}</h2>
        <div>
            <button>+ Add step</button>
        </div>
    </form>
    <div class="space-y-4">
        <div class="bg-slate-50/5 rounded">
            <div class="group">
                <button class="w-full flex flex-row gap-3 items-center px-3 py-2 transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0M3.124 7.5A8.969 8.969 0 015.292 3m13.416 0a8.969 8.969 0 012.168 4.5" />
                    </svg>
                    <span>Add due date</span>
                </button>
                <div class="absolute rounded bg-slate-950 w-64 text-sm hidden group-hover:block">
                    <button class="flex flex-row gap-3 items-center px-3 py-2 hover:bg-slate-50/10 last:rounded-b first:rounded-t w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span class="flex-grow text-left">Later today</span>
                        <span class="text-slate-400">8:00 PM</span>
                    </button>
                    <button class="flex flex-row gap-3 items-center px-3 py-2 hover:bg-slate-50/10 last:rounded-b first:rounded-t w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span class="flex-grow text-left">Later tomorrow</span>
                        <span class="text-slate-400">Tue, 9 AM</span>
                    </button>
                    <button class="flex flex-row gap-3 items-center px-3 py-2 hover:bg-slate-50/10 last:rounded-b first:rounded-t w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span class="flex-grow text-left">Next week</span>
                        <span class="text-slate-400">Mon, 9 AM</span>
                    </button>
                    <button class="flex flex-row gap-3 items-center px-3 py-2 hover:bg-slate-50/10 last:rounded-b first:rounded-t w-full border-slate-400 border-t">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                        </svg>
                        <span class="flex-grow text-left">Pick a time</span>
                    </button>
                </div>
            </div>
        </div>
        <form class="p-2">
            <input type="file" class="w-full">
        </form>
        <form class="p-2">
            <textarea class="outline-none w-full bg-slate-50/5 focus:bg-slate-50/10 rounded px-4 py-2"></textarea>
            <p class="text-xs italic text-slate-400">Updated on Thu, Spetember 14</p>
        </form>
    </div>
</div>
{% endblock %}
