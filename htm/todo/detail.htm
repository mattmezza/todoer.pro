{% if not request.headers["hx-request"] %}{% extends "lists/view.htm" %}{% endif %}
{% block content %}
<div class="p-8">
    <div class="mb-8 space-y-4">
        <a hx-get="/lists/{{ list.uuid }}" hx-target="#main" hx-push-url="true" class="flex items-center gap-1 text-sm cursor-pointer mb-2 hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 15.75L3 12m0 0l3.75-3.75M3 12h18" />
            </svg>
            <span>Back to list</span>
            <!--<span class="rounded-full w-3 h-3" style="background: {{ list.color }}">&nbsp;</span>
            <span>{{ list.title }}</span>-->
        </a>
        <div class="font-bold text-2xl mt-2">
            <h2 class="cursor-pointer hover:text-white rounded px-2 py-1 {% if done %}line-through{% endif %}" _="on click hide me then show the next <form /> then select() the next <input />">{{ title }}</h2>
            <form class="flex items-center gap-1" hx-put="/todos/{{ uuid }}/title" hx-target="previous h2" style="display: none" _="on submit or reset hide me then show the previous <h2 />">
                <input class="form-input px-2 py-1 text-2xl text-white w-full grow" name="title" value="{{ title }}" _="on keyup[key is 'Escape'] reset() on the closest <form />">
                <div class="flex items-center">
                    <button type="reset" class="btn text-xs py-0.5 text-white">Cancel</button>
                    <button type="submit" class="btn bg-indigo-500 text-xs py-0.5 text-white">Save</button>
                </div>
            </form>
        </div>
        <div class="hover:text-white cursor-pointer rounded text-sm" _="on click hide me then show the next <form /> then select() on the next <textarea />">
            {% if descr %}{{ descr }}{% else %}(no description){% endif %}
        </div>
        <form hx-put="/todos/{{ uuid }}/descr" hx-target="previous div" style="display: none" _="on submit or reset hide me then show the previous <div /> from me" class="rounded border border-slate-600 p-1">
            <textarea autofocus name="descr" class="form-input border-0 h-12 resize-none w-full p-2 text-sm" placeholder="Description..." _="on keyup[key is 'Escape'] reset() the closest <form />" >{% if descr %}{{ descr }}{% endif %}</textarea>
            <div class="flex justify-between items-center p-2">
                <div></div>
                <div class="">
                    <button type="reset" class="btn text-xs py-0.5 text-white">Cancel</button>
                    <button type="submit" class="btn bg-indigo-500 text-xs py-0.5 text-white">Save</button>
                </div>
            </div>
        </form>
        <div class="mb-8">
            <button>+ Add task</button>
        </div>
        <div class="space-y-4">
            <div class="bg-slate-50/5 rounded w-52">
                <div class="group">
                    <button class="w-full flex flex-row gap-3 items-center px-3 py-2 transition-all active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0M3.124 7.5A8.969 8.969 0 015.292 3m13.416 0a8.969 8.969 0 012.168 4.5" />
                        </svg>
                        <span>Add due date</span>
                    </button>
                    <div class="absolute rounded bg-slate-950 w-64 text-sm hidden group-hover:block">
                        <button class="flex flex-row gap-3 items-center px-3 py-2 hover:bg-slate-50/10 last:rounded-b first:rounded-t w-full">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <span class="flex-grow text-left">Later today</span>
                            <span class="text-slate-400">8:00 PM</span>
                        </button>
                        <button class="flex flex-row gap-3 items-center px-3 py-2 hover:bg-slate-50/10 last:rounded-b first:rounded-t w-full">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <span class="flex-grow text-left">Later tomorrow</span>
                            <span class="text-slate-400">Tue, 9 AM</span>
                        </button>
                        <button class="flex flex-row gap-3 items-center px-3 py-2 hover:bg-slate-50/10 last:rounded-b first:rounded-t w-full">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <span class="flex-grow text-left">Next week</span>
                            <span class="text-slate-400">Mon, 9 AM</span>
                        </button>
                        <button class="flex flex-row gap-3 items-center px-3 py-2 hover:bg-slate-50/10 last:rounded-b first:rounded-t w-full border-slate-400 border-t">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                            </svg>
                            <span class="flex-grow text-left">Pick a time</span>
                        </button>
                    </div>
                </div>
            </div>
            <h3 class="font-bold">Attachments</h3>
            <div _="on dragover or dragenter halt the event
    then add .bg-slate-700 to the target
  on dragleave or drop remove .bg-slate-700 from the target
  on drop halt the event
  then call processDrop(event)" class="w-full rounded p-12 bg-slate-50/5 flex items-center justify-center text-slate-400 text-xs font-semibold">
                <span>Drop your file here</span>
            </div>
            <h3 class="font-bold">Comments</h3>
        </div>
    </div>
</div>
<script>
    function processDrop(ev) {
        console.log(ev)
    }
</script>
{% endblock %}
