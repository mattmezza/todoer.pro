<li class="">
    <form class="flex flex-row gap-1 items-center px-4">
        <div class="py-3 px-4">
            <input class="cursor-pointer" hx-put="/todos/{{ uuid }}" hx-target="closest li" hx-swap="outerHTML" name="done"  type="checkbox" {% if done %}checked{% endif %} />
            <input name="title"  type="hidden" value="{{ title }}" />
        </div>

        <p hx-get="/todos/{{ uuid }}" hx-target="#main" hx-push-url="true" class="hover:bg-slate-50/10 cursor-pointer flex-grow py-3 px-2 {% if done %}line-through{% endif %}">{{ title }}</p>

        <div class="flex flex-row space-x-2">
            <button class="text-blue-500 hover:bg-slate-50/5 rounded p-4" hx-delete="/todos/{{ uuid }}" hx-target="closest li" hx-swap="outerHTML">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 text-red-400">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                </svg>
            </button>
        </div>
    </form>
</li>
