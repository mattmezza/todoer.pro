{% if not request.headers["hx-request"] %}{% extends "pages/page.htm" %}{% endif %}
{% block content %}
<div class="max-w-lg space-y-4 mx-auto">
    <img src="https://www.gravatar.com/avatar/{{ user.email_hash }}?s=150" class="rounded-full ring-4 ring-blue-500 mx-auto" />
    <div class="text-lg font-semibold">
        <div class="flex flex-row items-center justify-between">
            <span class="text-sm">Name</span>
        </div>
        <div class="bg-slate-50/5 rounded px-3 py-2 w-full cursor-pointer hover:bg-slate-50/10" _="on click hide me then show the next <form /> then select() on the next <input /> on keyup[key is 'Escape'] from the next <input /> hide the next <form /> then show me">
            {{ user.name }}
        </div>
        <form style="display: none" hx-put="/users/me/name" hx-target="previous div" _="on submit hide me then show the previous <div />">
            <input class="bg-slate-50/10 rounded px-3 py-2 w-full" type="text" name="name" value="{{ user.name }}">
        </form>
    </div>
    <div class="">
        <div class="flex flex-row items-center justify-between">
            <span class="text-sm">Email</span>
        </div>
        <div class="bg-slate-50/5 rounded px-3 py-2 w-full cursor-not-allowed">
            {{ user.email }}
        </div>
    </div>
</div>
    {% block loading %}
    <div id="loading-main" class="bg-slate-950/80 w-full h-full absolute top-0 left-0 flex flex-col items-center justify-center gap-2 hidden">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 animate-spin">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        <span>Loading</span>
    </div>
    {% endblock %}
{% endblock %}
