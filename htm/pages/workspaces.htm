{% if not request.headers["hx-request"] %}{% extends "pages/page.htm" %}{% endif %}
{% block content %}
<div class="py-8 px-2 md:px-8 max-w-screen-xl mx-auto">
    <h1 class="text-2xl md:text-4xl font-bold">Workspaces</h1>
    <ul class="my-16">
        {% for workspace in workspaces %}
            {{ tpls.workspaces.view({"workspace": workspace, "tasks_by_ws": tasks_by_ws[workspace.uuid]})|safe }}
        {% endfor %}
    </ul>
    <div
        class="flex flex-row space-x-1 items-center justify-center text-zinc-600 rounded px-3 py-3 group cursor-pointer"
        _="on click hide me then show the next <form /> then focus() the next <input />">
        <button tabindex="0" class="btn group-hover:text-indigo-500 gap-2">
            <div class="dark:text-slate-700 dark:group-hover:bg-indigo-500 dark:group-hover:text-white rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" />
                </svg>
            </div>
            <span class="hidden group-hover:block">Add workspace</span>
        </button>
    </div>
    <form
        style="display: none"
        hx-target="previous ul"
        hx-swap="beforeend"
        hx-post="/workspaces"
        hx-on::after-request="this.reset()"
        class="rounded-sm border border-slate-600 add-task-form mb-2"
        _="on reset or keyup[key is 'Escape'] hide me then show the previous <div />">
        <div class="py-2"">
            <input
                name="title"
                placeholder="Workspace name"
                autofocus
                class="form-input block py-1 px-23 border-0 w-full font-bold placeholder:font-bold"
            >
            <textarea
                autofocus
                name="descr"
                placeholder="Description"
                x-data="{
                    resize () {
                        $el.style.height = '0px';
                        $el.style.height = $el.scrollHeight + 'px'
                    }
                }"
                x-init="resize()"
                @input="resize()"
                @keydown.meta.enter="$event.target.form && $event.target.form.dispatchEvent(new Event('submit'))"
                @keydown.ctrl.enter="$event.target.form && $event.target.form.dispatchEvent(new Event('submit'))"
                _="on keyup[key is 'Escape'] reset() the closest <form />"
                class="form-input h-auto min-h-[40px] block py-1 px-23 border-0 w-full resize-none"
                ></textarea>
        </div>
        <div class="flex flex-row justify-between items-center border-t border-slate-600 px-3 py-2">
            <div>
            </div>
            <div class="space-x-2">
                <button type="reset" class="btn py-1">Cancel</button>
                <button type="submit" class="btn py-1 bg-indigo-600 text-white">
                    Add workspace
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
