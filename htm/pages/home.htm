{% if not request.headers["hx-request"] %}{% extends "pages/page.htm" %}{% endif %}
{% block content %}
<div class="p-8">
    <h1 class="text-3xl font-bold">Hi, {{ user.name }}!</h1>
    <h2 class="text-lg font-bold">Welcome back to your todos...</h2>
    <div class="mt-12 space-y-2">
        <h2 class="text-lg font-bold">This week</h2>
        <div class="flex flex-row gap-1 overflow-x-auto">
            <div class="p-8 max-w-xs rounded bg-green-700 h-full flex flex-col items-center justify-center">
                <span class="font-bold text-5xl">12</span>
                <span class="text-lg">TODOs done</span>
            </div>
            <div class="p-8 max-w-xs rounded bg-yellow-700 h-full flex flex-col items-center justify-center">
                <span class="font-bold text-5xl">24</span>
                <span class="text-lg">TODOs need doing</span>
            </div>
            <div class="p-8 max-w-xs rounded bg-red-700 h-full flex flex-col items-center justify-center">
                <span class="font-bold text-5xl">4</span>
                <span class="text-lg">TODOs undone</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
