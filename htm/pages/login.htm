{% extends "pages/auth.htm" %}
{% block content %}
<form action="/auth" method="POST" class="flex flex-col gap-2 justify-center items-center h-screen max-w-xs mx-auto">
    <h1 class="text-3xl font-bold mb-8">Todoer &middot; Login</h1>
    <input type="email" name="email" placeholder="Email..." class="px-3 py-2 rounded bg-slate-50/20 w-full" autofocus>
    <input type="password" name="password" placeholder="Password..." class="px-3 py-2 rounded bg-slate-50/20 w-full">
    <input type="hidden" name="path" value="{{ path }}">
    {% if error %}
    <p class="text-red-600">
        Invalid credentials.
    </p>
    {% endif %}
    <button type="submit" class="px-3 py-2 rounded bg-blue-500 transition-all active:scale-95 w-full">Login</button>
    <p class="mt-4">or <a class="text-blue-500 cursor-pointer hover:underline font-semibold" href="/signup">sign up</a></p>
</form>
{% endblock %}
