{% extends "pages/auth.htm" %}
{% block content %}
<div class="max-w-sm mx-auto w-full px-4 py-8">

    <h1 class="text-3xl text-slate-800 dark:text-slate-100 font-bold mb-6">Welcome back! ✨</h1>
    <!-- Form -->
    <form action="/auth" method="POST">
        {% if path %}<input type="hidden" name="path" value="{{ path }}">{% endif %}
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1" for="email">Email Address</label>
                <input id="email" name="email" class="form-input w-full" type="email">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1" for="password">Password</label>
                <input id="password" name="password" class="form-input w-full" type="password" autocomplete="on">
            </div>
        </div>
        <div class="flex items-center justify-between mt-6">
            <div class="mr-1">
                <a class="text-sm underline hover:no-underline" href="/reset-password">Forgot Password?</a>
            </div>
            <button type="submit" class="btn bg-indigo-500 hover:bg-indigo-600 text-white ml-3">Sign In</button>
        </div>
    </form>
    <!-- Footer -->
    <div class="pt-5 mt-6 border-t border-slate-200 dark:border-slate-700">
        <div class="text-sm">
            Don’t you have an account? <a class="font-medium text-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400" href="/signup">Sign Up</a>
        </div>

        {% if error %}
        <!-- Warning -->
        <div class="mt-5">
            <div class="bg-red-100 dark:bg-red-400/30 text-red-600 dark:text-red-400 px-3 py-2 rounded">
                <svg class="inline w-3 h-3 shrink-0 fill-current" viewBox="0 0 12 12">
                    <path d="M10.28 1.28L3.989 7.575 1.695 5.28A1 1 0 00.28 6.695l3 3a1 1 0 001.414 0l7-7A1 1 0 0010.28 1.28z"></path>
                </svg>
                <span class="text-sm">
                    Invalid credentials
                </span>
            </div>
        </div>
        {% endif %}
    </div>

</div>

{% endblock %}
