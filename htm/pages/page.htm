<!doctype html>
<html>
<head>
    <title>td</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{ url_for('public', path='/style.css') }}" rel="stylesheet">
</head>
<body class="dark:bg-black dark:text-zinc-100 min-h-screen">
    <nav class="h-12 dark:bg-slate-950 border-slate-950 border-b w-full px-8 flex flex-row justify-between items-center sticky top-0 z-20">
        <div class="flex flex-row items-center justify-start space-x-1">
            <button class="px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded" _="on click toggle .hidden on #sidePanel">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </button>
            <a hx-get="/" hx-target="#main" hx-push-url="true" class="px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
            </a>
            <form class="px-2 py-1 flex flex-row justify-start items-center space-x-1 rounded bg-gray-50/5 hover:bg-gray-50/10 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg>
                <input type="text" class="bg-transparent outline-none" name="q" placeholder="Search">
            </form>
        </div>
        <div class="flex flex-row items-center justify-end space-x-1">
            <button class="px-2 py-1 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
            </button>
            <div class="p-1 hover:bg-slate-50/10 rounded items-center justify-center flex relative">
                <button class="active:scale-95 transition-all" _="on click toggle .hidden on the next <div /> on keyup[key is 'Escape'] from the body add .hidden to the next <div />">
                    <img src="https://www.gravatar.com/avatar/{{ user.email_hash }}.jpg?s=100" class="rounded-full w-6 h-6" />
                </button>
                <div class="hidden w-36 bg-slate-950 rounded z-10 text-xs absolute group-hover:block space-y-2 right-0 top-9 shadow-black shadow-xl">
                    <button hx-get="/users/me" hx-target="#main" hx-push-url="true" class="flex flex-row gap-2 items-center hover:bg-slate-50/10 px-3 py-2 w-full transition-all active:scale-95 rounded-t" _="on click add .hidden to the closest <div />">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span>Profile</span>
                    </button>
                    <a href="/auth/logout" class="flex flex-row gap-2 items-center hover:bg-slate-50/10 px-3 py-2 w-full transition-all active:scale-95 rounded-b">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                        </svg>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <div class="flex flex-row">
        <nav id="sidePanel" class="w-64 border-slate-950 border-r py-10 px-2 min-h-screen h-full space-y-12 sticky top-12">
            <!--<div class="space-y-1">
                <a href="/inbox" class="flex flex-row space-x-4 p-2 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 text-blue-500">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 13.5h3.86a2.25 2.25 0 012.012 1.244l.256.512a2.25 2.25 0 002.013 1.244h3.218a2.25 2.25 0 002.013-1.244l.256-.512a2.25 2.25 0 012.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 00-2.15-1.588H6.911a2.25 2.25 0 00-2.15 1.588L2.35 13.177a2.25 2.25 0 00-.1.661z" />
                    </svg>
                    <span>Inbox</span>
                </a>
                <a href="/today" class="flex flex-row space-x-4 p-2 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 text-green-500">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                    </svg>
                    <span>Today</span>
                </a>
                <a href="/upcoming" class="flex flex-row space-x-4 p-2 cursor-pointer transition-all active:scale-95 hover:bg-gray-50/10 rounded">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 text-purple-500">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0 2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0 2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0 2.25h.008v.008H7.5v-.008zm6.75-4.5h.008v.008h-.008v-.008zm0 2.25h.008v.008h-.008V15zm0 2.25h.008v.008h-.008v-.008zm2.25-4.5h.008v.008H16.5v-.008zm0 2.25h.008v.008H16.5V15z" />
                    </svg>
                    <span>Upcoming</span>
                </a>
            </div>-->
            <div class="space-y-2">
                <div class="flex flex-row justify-between items-center">
                    <h3 class="font-bold text-sm px-2">Lists</h3>
                </div>
                <div class="w-full" hx-get="/nav/lists" hx-target="this" hx-trigger="load, lists-delete from:body">
                </div>
                <button _="on click showModal() on the next <dialog />" class="flex flex-row gap-4 w-full text-slate-400 px-2 py-1 cursor-pointer hover:bg-gray-50/10 rounded items-center transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    <span>Add list</span>
                </button>
                <dialog class="backdrop:bg-black/95 dark:bg-slate-800 px-8 py-4 rounded shadow-lg top-1/2 text-zinc-100">
                    <button _="on click close() on closest <dialog />" class="absolute right-4 top-4 text-zinc-100 cursor-pointer transition-all active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </button>
                    <form hx-post="/lists" hx-target="previous div" hx-swap="beforeend" _="on submit reset() on me then close() on closest <dialog />" class="flex flex-col gap-3">
                        <h2 class="font-bold text-lg">Add list</h2>
                        <div class="space-y-1">
                            <div class="text-xs flex flex-row items-center">
                                <span>List name</span>
                            </div>
                            <input tabindex="0" autofocus class="flex-grow rounded items-center bg-slate-950 px-2 py-1 text-slate-100 outline-none" name="title" placeholder="Type here..." />
                            <div class="text-xs flex flex-row items-center justify-end">
                            </div>
                        </div>
                        <div class="space-y-1">
                            <div class="text-xs flex flex-row items-center">
                                <span>Color</span>
                            </div>
                            <input tabindex="1" type="color" class="bg-transparent border-0 rounded outline-none" name="color" value="#ff0000" />
                            <div class="text-xs flex flex-row items-center justify-end">
                            </div>
                        </div>
                        <div class="flex flex-row gap-2 items-center justify-end">
                            <button type="submit" class="bg-blue-600 rounded px-3 py-1 transition-all active:scale-95">
                                Save
                            </button>
                        </div>
                    </form>
                </dialog>
            </div>
        </nav>
        <div id="main" class="p-4 flex-grow overflow-y-auto">
            {% block content %}{% endblock %}
        </div>
    </div>
    <script src="https://unpkg.com/htmx.org@1.9.5/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/hyperscript.org@0.9.11"></script>
    {% if DEBUG %} {{ hot_reload.script(url_for('hot-reload')) | safe }} {% endif%}
    {% if DEBUG %}<script src="https://unpkg.com/htmx.org/dist/ext/debug.js"></script>{% endif %}
</body>
</html>
