<!doctype html>
<html>
<head>
    <title>Todoer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/public/style.css" rel="stylesheet">
</head>
<body hx-ext="loading-states" class="font-inter antialiased bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 sidebar-expanded">
    <div class="flex h-[100dvh] overflow-hidden">
        {% include "partials/nav-menu.htm" %}
        <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden">
            {% include "partials/top-bar.htm" %}
            <div class="flex flex-row">
                <div id="main" class="grow">
                    {% block content %}
                        {% block loading %}
                            <div id="loading-main" class="bg-slate-950/80 w-full h-full absolute top-0 left-0 flex flex-col items-center justify-center gap-2 hidden">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 animate-spin">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                                </svg>
                                <span>Loading</span>
                            </div>
                        {% endblock %}
                    {% endblock %}
                </div>
            </div>
        </div>
    </div>
    <script src="//unpkg.com/alpinejs" defer></script>
    <script src="//unpkg.com/htmx.org@1.9.5/dist/htmx.min.js" defer></script>
    <script src="//unpkg.com/hyperscript.org@0.9.11" defer></script>
    <script src="//unpkg.com/htmx.org/dist/ext/loading-states.js" defer></script>
    {% if DEBUG %} {{ hot_reload.script(url_for('hot-reload')) | safe }} {% endif%}
    {% if DEBUG %}<script src="//unpkg.com/htmx.org/dist/ext/debug.js" defer></script>{% endif %}
    {% block scripts %}
    {% endblock %}
</body>
</html>
