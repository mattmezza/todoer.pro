<div data-file-row class="attachment-card">
<a class="attachment-card-main" href="/api/v1/attachments/{{ file.record.id }}/{% if file.can_preview() %}preview{% else %}download{% endif %}" {% if file.can_preview() %}target="_blank" rel="noopener noreferrer"{% endif %} title="{% if file.can_preview() %}Preview{% else %}Download{% endif %} {{ file.record.filename }}">
<span class="attachment-type" aria-hidden="true">{{ file.type_label() }}</span><span class="attachment-card-info"><strong>{{ file.record.filename }}</strong><span>{{ file.type_label() }} · {{ file.size_label() }} · {% if file.can_preview() %}Preview{% else %}Download{% endif %}</span></span></a>
<div class="attachment-card-actions"><a href="/api/v1/attachments/{{ file.record.id }}/download" aria-label="Download {{ file.record.filename }}" title="Download"><svg class="ui-icon" aria-hidden="true"><use href="/assets/icons.svg#download"/></svg></a>{% if file.can_delete %}<button type="button" data-file-delete="{{ file.record.id }}" data-file-revision="{{ file.record.revision }}" aria-label="Remove {{ file.record.filename }}" title="Remove file"><svg class="ui-icon" aria-hidden="true"><use href="/assets/icons.svg#trash"/></svg></button>{% endif %}</div>
</div>
