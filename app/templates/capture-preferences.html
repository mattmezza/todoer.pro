<form data-loading-pending="form" data-capture-preferences x-data="capturePreferences" x-on:submit.prevent="save" x-bind:aria-busy="busy ? 'true' : 'false'" class="ai-preferences" aria-busy="true">
<section class="settings-preference-card" aria-labelledby="capture-preferences-heading">
<h2 id="capture-preferences-heading">Task capture</h2>
<p class="muted">Turn a quick thought into a task with less typing.</p>
<label class="settings-check"><input type="checkbox" name="smart_enabled" x-model="smartEnabled" x-bind:disabled="!loaded || busy"><span>Recognize shortcuts<small>Pick lists, tags, and priorities as you type.</small></span></label>
<div data-date-options class="settings-dependent" hidden x-bind:hidden="!smartEnabled"><label class="settings-check"><input type="checkbox" name="date_enabled" x-model="dateEnabled" x-bind:disabled="!loaded || busy"><span>Recognize date phrases<small>Turn phrases like “tomorrow” into dates.</small></span></label></div>
<label class="settings-check"><input type="checkbox" name="repeat_capture" x-model="repeatCapture" x-bind:disabled="!loaded || busy"><span>Keep quick capture open after saving<small>Useful when you’re adding several tasks.</small></span></label>
</section>
<section class="settings-preference-card" aria-labelledby="ai-guidance-heading">
<h2 id="ai-guidance-heading">AI guidance</h2>
<p class="muted">Give your AI a little context about how you like to work.</p>
<details data-ai-instructions x-bind:open="instructionsOpen" x-on:toggle="instructionsOpen = $event.target.open"><summary>Personal instructions <span class="muted">· optional</span></summary><label>Instructions<textarea name="ai_instructions" x-model="instructions" x-bind:disabled="!loaded || busy" maxlength="1000" rows="4" placeholder="For example: keep tasks short and actionable."></textarea></label><p class="muted">Used only when you request AI assistance. Avoid sensitive details.</p></details>
</section>
<div class="settings-save-row"><button type="submit" class="primary" disabled x-bind:disabled="!loaded || busy">Save preferences</button><p data-capture-preferences-status x-text="status" role="status" aria-live="polite"></p><button type="button" data-capture-retry hidden x-bind:hidden="loaded || busy" x-on:click="load">Retry loading</button></div>
</form>
