<main data-planning-today="{{ today }}"><header class="planning-welcome"><h1>{{ title }}</h1><details class="planning-zone"><summary>{{ timezone }}{% if timezone != account_timezone %} · temporary{% endif %}</summary><form><input name="range" value="{{ range }}"><input name="spaces" value="{{ selected_spaces }}"><input name="tz" value="{{ timezone }}"><a href="/today?range={{ range }}&amp;spaces={{ selected_spaces }}">Use account timezone</a></form></details></header><nav class="planning-space-filters">{{ space_filters|safe }}</nav><nav class="planning-tabs">{{ tabs|safe }}</nav><section data-planning-rows>{{ body|safe }}</section></main>
