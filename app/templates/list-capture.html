<button {% if !can_write %}hidden{% endif %} class="add-task-trigger" id="capture-open"><svg class="ui-icon" width="20" height="20" aria-hidden="true"><use href="/assets/icons.svg#plus"/></svg> Add task</button>
<form hidden id="capture-form" class="entry-form inline-capture" action="/capture" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="list_id" value="{{ list_id }}"><input type="hidden" name="key" value="{{ capture_key }}"><label class="sr-only" for="capture-title">New task title</label><textarea id="capture-title" name="title" placeholder="Task name" required maxlength="500" autocomplete="off" rows="1"></textarea><label class="sr-only" for="capture-description">Task description</label><textarea id="capture-description" name="description" placeholder="Description" rows="2" maxlength="100000"></textarea><div class="inline-actions"><button type="button" id="capture-cancel">Cancel</button><button type="submit" class="primary">Add task</button></div></form>
