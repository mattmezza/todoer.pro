{% if !sidebar.archive_note.is_empty() %}<div class="list-archive-banner" role="region" aria-label="Archived list"><span title="{{ sidebar.archive_note }}">Archived list · read-only</span><span class="sr-only">{{ sidebar.archive_note }}</span>{% if sidebar.can_restore_list %}<button type="button" data-list-restore disabled data-list-id="{{ sidebar.current_list_id }}" data-revision="{{ sidebar.archive_revision }}">Restore list...</button>{% endif %}</div>{% endif %}
