<dialog class="quick-dialog" id="list-create-dialog" aria-labelledby="list-create-heading" x-data="listCreateDialog" x-on:click.document="openFromTrigger" x-on:close="closed" x-on:list-color-change="colorChanged"><button type="button" class="dialog-close" data-list-create-close x-on:click="close" aria-label="Close new list"><svg class="ui-icon" width="20" height="20" aria-hidden="true"><use href="/assets/icons.svg#close"/></svg></button><h2 id="list-create-heading">Add a new list</h2><p class="muted">Choose a colour and describe the tasks this list will hold.</p><form class="entry-form" data-create-list x-ref="form" x-on:submit.prevent="save">{% if sidebar.current_workspace_id.is_empty() %}<label>Space<select name="workspace_id" required x-on:change="suggestColor">{% for space in sidebar.spaces %}{% if space.writable %}<option value="{{ space.id }}">{{ space.title }}</option>{% endif %}{% endfor %}</select></label>{% else %}<input type="hidden" name="workspace_id" value="{% for space in sidebar.spaces %}{% if space.writable && space.id == sidebar.current_workspace_id %}{{ space.id }}{% endif %}{% endfor %}">{% endif %}<div class="list-color-field"><span>Color</span>{% include "list-color-picker.html" %}</div><label>List name<input name="title" data-reference-prefix="#" placeholder="Type here…" required maxlength="500"></label><label>Description<textarea name="description" placeholder="Type here…" rows="3" maxlength="100000"></textarea></label><p class="muted">The list inherits access from this private space.</p><div class="inline-actions"><button type="button" data-list-create-close x-on:click="close">Cancel</button><button type="submit" class="primary" x-bind:disabled="busy">Save</button></div><p data-create-list-error role="alert" x-text="error"></p></form></dialog>

<template id="list-color-picker-template">{% include "list-color-picker.html" %}</template>
