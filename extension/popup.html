<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todoer Pro</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <main>
      <header class="top">
        <div class="brand">
          <img src="icons/icon32.png" alt="" /> Todoer <span>pro</span>
        </div>
        <button id="settings" type="button">Settings</button>
      </header>
      <p id="status" class="status" role="status">Loading Todoer…</p>
      <section id="workspace" hidden>
        <label for="lists">List</label>
        <select id="lists"></select>
        <div class="list-actions">
          <button id="pin" type="button" hidden></button>
          <a id="open-list" target="_blank" rel="noopener noreferrer">Open list ↗</a>
        </div>
        <form id="capture">
          <label for="title">New task</label>
          <div class="capture-row">
            <input id="title" type="text" placeholder="What needs doing?" required />
            <button id="add" class="primary">Add</button>
          </div>
          <button id="discard" type="button" hidden>Discard pending task</button>
        </form>
        <section class="tasks" aria-labelledby="tasks-heading">
          <h2 id="tasks-heading">Open tasks</h2>
          <p id="list-status" class="hint" role="status"></p>
          <ul id="tasks"></ul>
        </section>
      </section>
    </main>
  </body>
</html>
