<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todoer Pro extension settings</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="icons/icon32.png" alt="" /> Todoer <span>pro</span>
      </header>
      <h1>Extension settings</h1>
      <form id="server-form">
        <label for="origin">Todoer server</label>
        <input id="origin" type="url" required />
        <div class="actions">
          <button class="primary">Save server</button>
          <a id="open-todoer" target="_blank" rel="noopener">Open Todoer</a>
        </div>
      </form>
      <section>
        <h2>Pinned websites</h2>
        <p>Copy a list’s URL from Todoer and assign it to a website.</p>
        <form id="pin-form">
          <label for="site">Website hostname</label>
          <input id="site" placeholder="example.com" required />
          <label for="list-url">Todoer list URL</label>
          <input id="list-url" type="url" required />
          <button class="primary">Save pin</button>
        </form>
        <ul id="pins"></ul>
      </section>
      <section id="previous-draft" hidden>
        <h2>Previous capture</h2>
        <p>Check whether this capture reached Todoer before saving it again.</p>
        <a id="review-draft" target="_blank" rel="noopener">Review draft</a>
        <button id="dismiss-draft" type="button">Dismiss</button>
      </section>
      <p id="status" role="status"></p>
    </main>
  </body>
</html>
