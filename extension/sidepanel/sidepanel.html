<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todoer.pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      height: 44px;
      flex-shrink: 0;
    }

    .panel-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #f1f5f9;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
    }

    .panel-brand svg {
      width: 20px;
      height: 20px;
    }

    .panel-actions {
      display: flex;
      gap: 4px;
    }

    .panel-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .panel-btn:hover {
      background: #334155;
      color: #e2e8f0;
    }

    .panel-btn svg {
      width: 15px;
      height: 15px;
    }

    .panel-body {
      display: flex;
      flex-direction: column;
      height: calc(100% - 44px);
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #0f172a;
    }

    .panel-error {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #64748b;
      font-size: 14px;
      text-align: center;
      padding: 24px;
    }

    .panel-error svg {
      width: 40px;
      height: 40px;
      color: #334155;
    }

    .panel-error h3 {
      color: #94a3b8;
      font-size: 15px;
      font-weight: 600;
    }

    .btn-open {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-open:hover {
      background: #4f46e5;
    }

    .url-display {
      font-size: 11px;
      color: #475569;
      background: #1e293b;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="panel-header">
    <div class="panel-brand">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="1" y="1" width="22" height="22" rx="5" fill="#4f46e5"/>
        <rect x="5" y="7.5" width="9" height="2" rx="1" fill="white" opacity="0.9"/>
        <rect x="5" y="11" width="13" height="2" rx="1" fill="white" opacity="0.9"/>
        <rect x="5" y="14.5" width="7" height="2" rx="1" fill="white" opacity="0.9"/>
        <circle cx="18.5" cy="16" r="4" fill="#22c55e"/>
        <path d="M16.5 16 l1.5 1.5 l2.5-2.5" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Todoer
    </div>
    <div class="panel-actions">
      <!-- Navigate back -->
      <button class="panel-btn" id="btn-back" title="Go back">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
        </svg>
      </button>
      <!-- Navigate forward -->
      <button class="panel-btn" id="btn-forward" title="Go forward">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
        </svg>
      </button>
      <!-- Reload -->
      <button class="panel-btn" id="btn-reload" title="Reload">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/>
        </svg>
      </button>
      <!-- Open in new tab -->
      <button class="panel-btn" id="btn-newtab" title="Open in new tab">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="panel-body">
    <iframe id="app-frame" title="Todoer.pro" allow="same-origin"></iframe>
    <div class="panel-error" id="panel-error" style="display:none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
      </svg>
      <h3>Cannot load Todoer</h3>
      <p>Check your internet connection or<br>verify the base URL in settings.</p>
      <span class="url-display" id="error-url"></span>
      <a class="btn-open" id="btn-open-in-tab" href="#">
        Open in tab instead
      </a>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
