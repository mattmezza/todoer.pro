<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todoer.pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <!-- Inline SVG logo -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="22" height="22" rx="5" fill="#4f46e5"/>
        <rect x="5" y="7.5" width="9" height="2" rx="1" fill="white" opacity="0.9"/>
        <rect x="5" y="11" width="13" height="2" rx="1" fill="white" opacity="0.9"/>
        <rect x="5" y="14.5" width="7" height="2" rx="1" fill="white" opacity="0.9"/>
        <circle cx="18.5" cy="16" r="4" fill="#22c55e"/>
        <path d="M16.5 16 l1.5 1.5 l2.5-2.5" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Todoer
    </div>
    <div class="header-actions">
      <!-- Open side panel -->
      <button class="icon-btn" id="btn-sidepanel" title="Open side panel">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"/>
          <rect x="14" y="4" width="6" height="16" rx="1.5" fill="currentColor" opacity="0.2"/>
        </svg>
      </button>
      <!-- Open full app -->
      <button class="icon-btn" id="btn-open-app" title="Open Todoer in new tab">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/>
        </svg>
      </button>
      <!-- Settings -->
      <button class="icon-btn" id="btn-settings" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Auth screen (shown when not logged in) -->
  <div id="auth-screen" style="display:none">
    <div class="auth-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
      </svg>
    </div>
    <h2>Sign in to Todoer</h2>
    <p>Log in to your account to add tasks<br>and access your lists.</p>
    <button class="btn btn-primary" id="btn-signin">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
        <path fill-rule="evenodd" d="M3 4.25A2.25 2.25 0 0 1 5.25 2h5.5A2.25 2.25 0 0 1 13 4.25v2a.75.75 0 0 1-1.5 0v-2a.75.75 0 0 0-.75-.75h-5.5a.75.75 0 0 0-.75.75v11.5c0 .414.336.75.75.75h5.5a.75.75 0 0 0 .75-.75v-2a.75.75 0 0 1 1.5 0v2A2.25 2.25 0 0 1 10.75 18h-5.5A2.25 2.25 0 0 1 3 15.75V4.25Z" clip-rule="evenodd"/>
        <path fill-rule="evenodd" d="M19 10a.75.75 0 0 0-.75-.75H8.704l1.048-1.048a.75.75 0 1 0-1.06-1.06l-2.25 2.25a.75.75 0 0 0 0 1.06l2.25 2.25a.75.75 0 0 0 1.06-1.06l-1.048-1.048h9.546A.75.75 0 0 0 19 10Z" clip-rule="evenodd"/>
      </svg>
      Sign in to Todoer
    </button>
  </div>

  <!-- Main app (shown when logged in) -->
  <div id="main-screen" style="display:none">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="add">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="14" height="14" style="display:inline;vertical-align:-2px;margin-right:4px">
          <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z"/>
        </svg>
        Add Task
      </button>
      <button class="tab-btn" data-tab="search">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="14" height="14" style="display:inline;vertical-align:-2px;margin-right:4px">
          <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd"/>
        </svg>
        Search
      </button>
      <button class="tab-btn" data-tab="links">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="14" height="14" style="display:inline;vertical-align:-2px;margin-right:4px">
          <path fill-rule="evenodd" d="M4.5 2A1.5 1.5 0 0 0 3 3.5v13A1.5 1.5 0 0 0 4.5 18h11a1.5 1.5 0 0 0 1.5-1.5V7.621a1.5 1.5 0 0 0-.44-1.06l-4.12-4.122A1.5 1.5 0 0 0 11.378 2H4.5Zm2.25 8.5a.75.75 0 0 0 0 1.5h6.5a.75.75 0 0 0 0-1.5h-6.5Zm0 3a.75.75 0 0 0 0 1.5h6.5a.75.75 0 0 0 0-1.5h-6.5Zm0-6a.75.75 0 0 0 0 1.5h3a.75.75 0 0 0 0-1.5h-3Z" clip-rule="evenodd"/>
        </svg>
        Browse
      </button>
    </div>

    <!-- Add Task Tab -->
    <div id="tab-add" class="tab-panel active">
      <form id="quick-add-form">
        <div style="padding: 14px 14px 0">
          <div class="form-group">
            <input
              type="text"
              id="task-title"
              name="title"
              class="form-input"
              placeholder="Task name"
              required
              autofocus
            >
          </div>
          <div class="form-group">
            <textarea
              id="task-descr"
              name="descr"
              class="form-textarea"
              placeholder="Description or URL (optional)"
              rows="2"
            ></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Space</label>
              <select id="space-select" class="form-select">
                <option value="">Loading...</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">List</label>
              <select id="list-select" class="form-select">
                <option value="">Loading...</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Section</label>
            <select id="section-select" class="form-select">
              <option value="">Loading...</option>
            </select>
          </div>
        </div>
        <div class="form-actions" style="padding: 0 14px 14px">
          <span class="hint">
            <kbd>Ctrl+Enter</kbd> to save
          </span>
          <button type="button" class="btn btn-sm" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn btn-sm btn-primary" id="btn-submit">
            <span id="submit-label">Add task</span>
            <span id="submit-spinner" class="spinner" style="display:none"></span>
          </button>
        </div>
      </form>
    </div>

    <!-- Search Tab -->
    <div id="tab-search" class="tab-panel">
      <div class="search-input-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
        </svg>
        <input type="search" id="search-input" placeholder="Search tasks, lists, spaces...">
      </div>
      <div id="search-results" class="search-results">
        <div class="search-empty">Type to search...</div>
      </div>
    </div>

    <!-- Browse / Links Tab -->
    <div id="tab-links" class="tab-panel">
      <div style="padding: 12px 14px;">
        <div class="nav-section-title">Quick Links</div>
        <a class="nav-link" id="link-inbox" href="#" data-path="/inbox">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M2.5 3A1.5 1.5 0 0 0 1 4.5v4A1.5 1.5 0 0 0 2.5 10H3v1.5A1.5 1.5 0 0 0 4.5 13H5v.5A1.5 1.5 0 0 0 6.5 15h7a1.5 1.5 0 0 0 1.5-1.5V13h.5a1.5 1.5 0 0 0 1.5-1.5V10h.5A1.5 1.5 0 0 0 19 8.5v-4A1.5 1.5 0 0 0 17.5 3h-15ZM3 8.5V4.5h14v4H3Zm10.5 1.5v.5h-7V10h7Z" clip-rule="evenodd"/>
          </svg>
          Inbox
        </a>
        <a class="nav-link" id="link-dashboard" href="#" data-path="/dashboard">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 2a1 1 0 0 0-1 1v6H4a1 1 0 0 0 0 2h4v6a1 1 0 1 0 2 0v-6h4a1 1 0 1 0 0-2h-4V3a1 1 0 0 0-1-1Z" clip-rule="evenodd"/>
          </svg>
          Dashboard
        </a>

        <div class="nav-divider"></div>
        <div class="nav-section-title">Lists</div>
        <div id="lists-nav">
          <div class="search-empty" style="padding: 12px 0">Loading lists...</div>
        </div>
      </div>
    </div>

  </div><!-- /main-screen -->

  <!-- Status bar -->
  <div class="status-bar" id="status-bar">
    <span class="status-dot" id="status-dot"></span>
    <span class="status-text" id="status-text">Checking connection...</span>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
