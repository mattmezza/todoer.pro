services:
  app:
    image: "todoer_app:${TAG}"
    container_name: todoer_app_dev
    ports:
      - "4001:80"
    environment:
      TODOER_SECRET_KEY: "${TODOER_SECRET_KEY_DEV}"
      TODOER_ACCESS_TOKEN_EXPIRE_MINUTES: "43200" # 30d -> 60 * 24 * 30
      TODOER_AUTH_COOKIE_EXPIRE_MINUTES: "43200" # 30d -> 60 * 24 * 30
      TODOER_DB_URL: "sqlite:////var/todoer.db"
      TODOER_ENV: "dev"
    volumes:
      - "./data/todoer_dev.db:/var/todoer.db"
  networks:
    default:
      ipam:
        config:
          -
            subnet: 172.30.0.0/16
