name: todoer-local
services:
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: synthetic-test
      MINIO_ROOT_PASSWORD: synthetic-test-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - attachments:/data
  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - storage
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        until mc alias set local http://storage:9000 synthetic-test synthetic-test-secret; do sleep 1; done
        mc mb --ignore-existing local/todoer-attachments
        mc mb --ignore-existing local/todoer-synthetic-attachments
        mc anonymous set none local/todoer-attachments
        mc anonymous set none local/todoer-synthetic-attachments
volumes:
  attachments:
