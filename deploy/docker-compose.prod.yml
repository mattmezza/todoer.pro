services:
  app:
    image: "todoers_app:${TAG}"
    container_name: todoers_app_prod
    ports:
      - "4010:80"
    environment:
      TODOERS_SECRET_KEY: "${TODOERS_SECRET_KEY_PROD}"
      TODOERS_ACCESS_TOKEN_EXPIRE_MINUTES: "43200" # 30d -> 60 * 24 * 30
      TODOERS_AUTH_COOKIE_EXPIRE_MINUTES: "43200" # 30d -> 60 * 24 * 30
      TODOERS_DB_URL: "sqlite:///../todoers-prod.db"
      TODOERS_ENV: "prod"
  networks:
    default:
      ipam:
        config:
          -
            subnet: 172.31.0.0/16
