services:
  app:
    image: "todoer_app:${TAG}"
    container_name: todoer_app_prod
    restart: always
    ports:
      - "4010:80"
    environment:
      TODOER_SECRET_KEY: "${TODOER_SECRET_KEY_PROD}"
      TODOER_ACCESS_TOKEN_EXPIRE_MINUTES: "43200" # 30d -> 60 * 24 * 30
      TODOER_AUTH_COOKIE_EXPIRE_MINUTES: "43200" # 30d -> 60 * 24 * 30
      TODOER_DB_URL: "sqlite:////var/todoer.db"
      TODOER_ENV: "prod"
      TODOER_RELEASE: "${TAG}"
      TODOER_STORAGE_ACCESS_KEY_ID: "${TODOER_STORAGE_ACCESS_KEY_ID}"
      TODOER_STORAGE_SECRET_KEY: "${TODOER_STORAGE_SECRET_KEY_PROD}"
      TODOER_STORAGE_ENDPOINT: "${TODOER_STORAGE_ENDPOINT}"
      TODOER_STORAGE_BUCKET: "${TODOER_STORAGE_BUCKET_PROD}"
      TODOER_STORAGE_PRESIGNED_URL_DURATION_DEFAULT_MINUTES: "5"
    volumes:
      - "./data/todoer_prod.db:/var/todoer.db"
networks:
  default:
    ipam:
      config:
        -
          subnet: 172.31.0.0/16
