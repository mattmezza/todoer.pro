name: todoer-rebuild
services:
  app:
    image: ${TODOER_REBUILD_IMAGE:?Set a reviewed image digest}
    platform: linux/amd64
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=640m,mode=1777
    env_file:
      - path: ${TODOER_REBUILD_APP_ENV:?Set separate app.env path}
        format: raw
    environment:
      TODOER_DEV_AUTH: "0"
      TODOER_RUST_DB: /data/todoer.db
      TODOER_RUST_BIND: 0.0.0.0
      TODOER_RUST_PORT: "8092"
      TODOER_PUBLIC_URL: ${TODOER_PUBLIC_URL:?Set canonical HTTPS origin}
    expose: ["8092"]
    volumes:
      - rebuild-data:/data
    networks:
      proxy:
        aliases: [todoer-rebuild]
    stop_grace_period: 45s
  litestream:
    depends_on:
      app:
        condition: service_healthy
    image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    platform: linux/amd64
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    env_file:
      - path: ${TODOER_REBUILD_REPLICA_ENV:?Set separate replica.env path}
        format: raw
    environment:
      TODOER_RUST_DB: /data/todoer.db
    command: [replicate, -config, /etc/litestream.yml]
    volumes:
      - rebuild-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    networks: [replication]
    stop_grace_period: 35s
networks:
  proxy:
    external: true
    name: ${TODOER_REBUILD_PROXY_NETWORK:?Set existing proxy network}
  replication: {}
volumes:
  rebuild-data:
    name: ${TODOER_REBUILD_VOLUME:-todoer_rebuild_data_v1}
