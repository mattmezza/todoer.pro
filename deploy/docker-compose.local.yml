services:
  app:
    image: "todoer_app:${TAG}"
    container_name: todoer_app_local
    ports:
      - "4002:80"
    environment:
      TODOER_SECRET_KEY: "${TODOER_SECRET_KEY_LOCAL}"
      TODOER_ACCESS_TOKEN_EXPIRE_MINUTES: "43200" # 30d -> 60 * 24 * 30
      TODOER_AUTH_COOKIE_EXPIRE_MINUTES: "43200" # 30d -> 60 * 24 * 30
      TODOER_DB_URL: "sqlite:////var/todoer.db"
      TODOER_ENV: "local"
      TODOER_RELEASE: "${TAG}"
      TODOER_STORAGE_ACCESS_KEY_ID: "${TODOER_STORAGE_ACCESS_KEY_ID}"
      TODOER_STORAGE_SECRET_KEY: "${TODOER_STORAGE_SECRET_KEY_LOCAL}"
      TODOER_STORAGE_ENDPOINT: "${TODOER_STORAGE_ENDPOINT}"
      TODOER_STORAGE_BUCKET: "${TODOER_STORAGE_BUCKET_LOCAL}"
      TODOER_STORAGE_PRESIGNED_URL_DURATION_DEFAULT_MINUTES: "100"
    volumes:
      - "./data/todoer_local.db:/var/todoer.db"
