[package]
name = "todoer"
version = "0.1.0"
edition = "2024"
default-run = "todoer-server"

[dependencies]
axum = "=0.8.9"
askama = "=0.16.1"
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "limit", "trace", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }

rmcp = { version = "=3.7.0", features = ["transport-streamable-http-server"] }
schemars = "1"
pulldown-cmark = "=0.13.5"
ammonia = "=4.2.4"
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
sha2 = "0.10"
