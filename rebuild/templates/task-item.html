<article class="task {% if task.complete %}is-complete{% endif %} {% if task.parent_id.is_some() %}is-child{% endif %}" data-id="{{ task.id }}" data-revision="{{ task.revision }}" data-complete="{{ task.complete }}" data-parent-id="{{ task.parent_id.as_deref().unwrap_or("") }}">
<button {% if !can_write %}disabled{% endif %} class="completion" aria-label="{% if task.complete %}Reopen{% else %}Complete{% endif %} {{ task.title }}" aria-pressed="{{ task.complete }}">{% if task.complete %}<svg class="ui-icon" aria-hidden="true"><use href="/assets/icons.svg#check"/></svg>{% endif %}</button>
<div class="task-content"><a class="task-title" href="/tasks/{{ task.id }}">{{ task.title }}</a>{% if !task.description.is_empty() %}<div class="task-description markdown">{{ task.description_html|safe }}</div>{% endif %}<span class="task-ref">%{{ task.reference }}</span></div>
<button type="button" class="task-drag-grip" data-touch-order aria-label="Drag to reorder {{ task.title }}" {% if !can_write %}hidden{% endif %}><svg class="ui-icon" aria-hidden="true"><circle cx="9" cy="6" r="1.5" fill="currentColor"/><circle cx="9" cy="12" r="1.5" fill="currentColor"/><circle cx="9" cy="18" r="1.5" fill="currentColor"/><circle cx="15" cy="6" r="1.5" fill="currentColor"/><circle cx="15" cy="12" r="1.5" fill="currentColor"/><circle cx="15" cy="18" r="1.5" fill="currentColor"/></svg></button><details class="task-actions"><summary class="task-menu" aria-label="Actions for {{ task.title }}"><svg class="ui-icon" width="20" height="20" aria-hidden="true"><use href="/assets/icons.svg#more"/></svg></summary><div class="menu-items">{% if can_write %}<button type="button" data-order-up aria-label="Move {{ task.title }} up" class="min-h-11 min-w-11">Move up</button><button type="button" data-order-down aria-label="Move {{ task.title }} down" class="min-h-11 min-w-11">Move down</button><button type="button" data-action="rename">Rename inline</button><button type="button" data-action="complete-subtree">Complete sub-tasks</button>{% endif %}<a href="/tasks/{{ task.id }}">Open</a><button type="button" data-task-move-open="{{ task.id }}">Move to list or section…</button></div></details>
</article>
