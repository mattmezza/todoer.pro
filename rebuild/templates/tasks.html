{% for task in tasks %}
<article class="task {% if task.complete %}is-complete{% endif %} {% if task.parent_id.is_some() %}is-child{% endif %}" data-id="{{ task.id }}" data-revision="{{ task.revision }}" data-complete="{{ task.complete }}" data-parent-id="{{ task.parent_id.as_deref().unwrap_or("") }}">
<button {% if !can_write %}disabled{% endif %} class="completion" aria-label="{% if task.complete %}Reopen{% else %}Complete{% endif %} {{ task.title }}" aria-pressed="{{ task.complete }}">{% if task.complete %}<span aria-hidden="true">✓</span>{% endif %}</button>
<div class="task-content"><button class="task-title" data-action="edit">{{ task.title }}</button>{% if !task.description.is_empty() %}<div class="task-description markdown">{{ task.description_html|safe }}</div>{% endif %}<span class="task-ref">%{{ task.reference }}</span></div>
<details class="task-actions"><summary class="task-menu" aria-label="Actions for {{ task.title }}">···</summary><div class="menu-items">{% if can_write %}<button type="button" data-order-handle draggable="true" aria-label="Drag to reorder {{ task.title }}" class="min-h-11 min-w-11">Drag to reorder</button><button type="button" data-order-up aria-label="Move {{ task.title }} up" class="min-h-11 min-w-11">Move up</button><button type="button" data-order-down aria-label="Move {{ task.title }} down" class="min-h-11 min-w-11">Move down</button><button type="button" data-action="rename">Rename inline</button><button type="button" data-action="complete-subtree">Complete checklist</button>{% endif %}<button type="button" data-action="edit">Open details</button></div></details>
</article>
{% endfor %}
{% if tasks.is_empty() %}<div class="empty"><span aria-hidden="true">◯</span><h2>A clear starting point.</h2><p>Add your first task below.</p></div>{% endif %}
