<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="account-id" content="{{ sidebar.account_id }}"><meta name="csrf-token" content="{{ sidebar.csrf }}"><title>Settings · Todoer</title><link rel="stylesheet" href="/assets/app.css"><script type="module" src="/assets/site.js"></script><script type="module" src="/assets/general-settings.js"></script></head><body class="reference-list-page planning-list-page settings-page">{% include "mobile-nav.html" %}{% include "sidebar.html" %}<main id="main"><header class="planning-welcome"><h1>General settings</h1></header><section class="general-settings"><h2>Calendar</h2><form data-calendar-preferences class="grid gap-4"><label>Timezone<input name="timezone" list="account-timezones" required placeholder="Search timezones…" autocomplete="off"></label><datalist id="account-timezones"></datalist><label>Week starts on<select name="week_start"><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option><option value="7">Sunday</option></select></label><p class="muted">Planning ranges use this timezone and first day of the week.</p><button class="primary" type="submit">Save preferences</button><p data-preference-status role="status"></p></form></section></main>{% include "list-create-modal.html" %}</body></html>
