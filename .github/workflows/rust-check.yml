name: Rust development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-checks:
    # Job-level guard prevents fork PR code from reaching a private runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.TODOER_RUNNER_LABELS || '["self-hosted","todoer-private"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check Rust development increment
        run: make rust-check
      - name: Install Chromium and Firefox
        run: npx playwright install chromium firefox
      - name: Exercise isolated development server
        shell: bash
        env:
          TODOER_DEV_AUTH: '1'
          TODOER_DEV_TOKEN: local-integration-token-not-for-production
          TODOER_TOKEN: local-integration-token-not-for-production
          TODOER_RUST_PORT: '8092'
          TODOER_URL: http://127.0.0.1:8092
          TODOER_MCP_URL: http://127.0.0.1:8092/mcp
        run: |
          set -euo pipefail
          test_dir=$(mktemp -d "${RUNNER_TEMP}/todoer-rust-check.XXXXXX")
          server_pid=''
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$test_dir"
          }
          trap cleanup EXIT
          export TODOER_RUST_DB="$test_dir/synthetic.db"
          if curl --silent --fail --max-time 1 http://127.0.0.1:8092/health >/dev/null; then
            echo 'Port 8092 already hosts a server; refusing to test against existing data.' >&2
            exit 1
          fi
          target/debug/todoer-server >"$test_dir/server.log" 2>&1 &
          server_pid=$!
          ready=false
          for attempt in {1..20}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$test_dir/server.log"
              exit 1
            fi
            if curl --silent --fail --max-time 0.5 http://127.0.0.1:8092/health >/dev/null; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [[ "$ready" != true ]]; then
            cat "$test_dir/server.log"
            echo 'Development server did not become healthy within the 20-second polling budget.' >&2
            exit 1
          fi
          python3 scripts/rebuild-cli-check.py
          if command -v uv >/dev/null; then
            uv run --no-project scripts/rebuild-mcp-check.py
          else
            echo 'uv unavailable; optional official Python MCP SDK check skipped.'
          fi
          npx playwright test --project=chromium --project=firefox --workers=1
