name: Deploy app to VPS
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published app release (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: app-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Verify published release and image
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$VERSION" --repo "$REPOSITORY" --json isDraft,isPrerelease,tagName \
            --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
          image="ghcr.io/$REPOSITORY:$VERSION"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy verified release
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.release.outputs.digest }}
          DEPLOY_HOST: ${{ vars.TODOER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.TODOER_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.TODOER_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TODOER_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/todoer-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/todoer-deploy" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/todoer-deploy" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $VERSION $DIGEST"
