name: Publish explicit release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'(cli-)?v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Expected vX.Y.Z or cli-vX.Y.Z')
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'kind={"cli" if tag.startswith("cli-") else "app"}\ntag={tag}\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - run: npm ci && make check
  image:
    needs: validate
    if: needs.validate.outputs.kind == 'app'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: TODOER_BUILD_VERSION=${{ needs.validate.outputs.tag }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.tag }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.validate.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  cli:
    needs: validate
    if: needs.validate.outputs.kind == 'cli'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - name: Use Strawberry Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/Strawberry/perl/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: make assets
        shell: bash
      - run: cargo build --locked --release --features portable-cli --bin todoer --target ${{ matrix.target }}
        env:
          TODOER_BUILD_VERSION: ${{ needs.validate.outputs.tag }}
      - name: Attach executable and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          suffix=''
          if [[ "$TARGET" == *windows* ]]; then suffix='.exe'; fi
          asset="todoer-$RELEASE_TAG-$TARGET$suffix"
          cp "target/$TARGET/release/todoer$suffix" "$asset"
          python3 - "$asset" <<'PY'
          import hashlib, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          pathlib.Path(str(p) + '.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n')
          PY
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY"
