[project]
name = "todoer"
version = "0.1.0"
description = "Todoer Pro"
authors = [{name = "Matteo Merola", email = "mattmezza@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.103.1",
    "jinja2>=3.1.2",
    "uvicorn[standard]>=0.23.2",
    "arel>=0.2.0",
    "python-multipart>=0.0.6",
    "databases[aiosqlite]>=0.8.0",
    "greenlet>=2.0.2",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "pydantic[email]>=2.3.0",
    "shortuuid>=1.0.11",
    "boto3>=1.33.4",
    "humanize>=4.9.0",
    "jinjax>=0.35",
    "markdown>=3.6",
    "pymdown-extensions>=10.9",
    "pygments>=2.18.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4",
    "cryptography>=41.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "black>=23.9.1",
    "isort>=5.12.0",
]

[tool.black]
line-length = 79
skip-string-normalization = true
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.isort]
# below are compatible settings with `black`
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 79
